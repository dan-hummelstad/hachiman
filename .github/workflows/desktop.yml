# Builds the Electron app: a .dmg on macOS (Apple Silicon) and an NSIS .exe installer on Windows.
# Each upload replaces the previous one: the last job deletes the artifacts of older runs, so
# only the newest hachiman-macos and hachiman-windows artifacts exist.
# The builds are unsigned (macOS: right-click > Open on first start; Windows: SmartScreen "Run anyway").
# Repository variable HACHIMAN_DOMAIN: Vite bakes the endpoints in at build time.
# The release job publishes both builds as zip files in a GitHub release (tag desktop-<run number>)
# in the repository <owner>/hachiman-release. The installed apps update themselves from the newest
# release through Takusen (contract §4 Desktop updates), which reads the "Commit:" line of the notes. Secret HACHIMAN_RELEASE_TOKEN: a fine-grained token with
# Contents: read and write on that repository only. The repository needs at least one commit.
name: Desktop
on:
  push:
    branches: [main]
    paths:
      - 'apps/hachiman/**'
      - 'apps/hachiman-electron/**'
      - 'pkgs/**'
      - 'patches/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

# One run at a time: a new push cancels the older run (the updater only wants the newest build).
# Overlapping runs pruned each other's artifacts, and a release then found none.
concurrency:
  group: desktop
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: mac, artifact: hachiman-macos, glob: '*.dmg' }
          - { os: windows-latest, target: win, artifact: hachiman-windows, glob: '*.exe' }
    runs-on: ${{ matrix.os }}
    env:
      VITE_TAKUSEN_OIDC_ISSUER: https://${{ vars.HACHIMAN_DOMAIN }}/api/oidc
      VITE_HACHIMAN_GATEWAY_URL: wss://${{ vars.HACHIMAN_DOMAIN }}/gateway
      # The updater compares this with Takusen's newest build (src/main/updater.ts).
      MAIN_VITE_BUILD_SHA: ${{ github.sha }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check the domain variable
        if: vars.HACHIMAN_DOMAIN == ''
        shell: bash
        run: echo "::error::Set the repository variable HACHIMAN_DOMAIN" && exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm -F @hachiman/hachiman-electron build:${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: apps/hachiman-electron/dist/${{ matrix.glob }}
          if-no-files-found: error
          overwrite: true

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Zip each build
        working-directory: dist
        run: for d in hachiman-macos hachiman-windows; do (cd "$d" && zip -q -r "../$d.zip" .); done
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.HACHIMAN_RELEASE_TOKEN }}
        run: |
          gh release create "desktop-${{ github.run_number }}" dist/*.zip \
            --repo "${{ github.repository_owner }}/hachiman-release" \
            --title "Desktop build ${{ github.run_number }} (${GITHUB_SHA::7})" \
            --notes "Commit: ${{ github.sha }}

          Unsigned builds. macOS: right-click > Open on first start. Windows: SmartScreen > Run anyway."

  prune:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete the artifacts of older runs
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            for (const name of ['hachiman-macos', 'hachiman-windows']) {
              const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, { owner, repo, name })
              for (const a of artifacts) {
                // Older runs only (run ids grow): never the artifacts of a newer run.
                if (a.workflow_run && a.workflow_run.id < context.runId) await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: a.id })
              }
            }
