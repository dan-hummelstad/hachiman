# Builds the server images for linux/arm64 (the Oracle A1 VM) and pushes them to GHCR as
# ghcr.io/<owner>/hachiman-<name>:latest and :<sha>. infra/deploy.sh pulls them.
# Repository variable HACHIMAN_DOMAIN (Settings > Secrets and variables > Actions > Variables):
# the web image bakes the endpoints in at build time.
name: Images
on:
  push:
    branches: [main]
    paths:
      - 'apps/takusen/**'
      - 'apps/hachiman/**'
      - 'apps/hachiman-browser/**'
      - 'apps/hachiman-electron/src/main/csp-policy.ts'
      - 'apps/hachiman-server/**'
      - 'pkgs/**'
      - 'patches/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    # arm64 standard runners are free in private repositories (counted against the plan minutes).
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gateway, context: apps/hachiman-server, file: apps/hachiman-server/Dockerfile.gateway }
          - { name: media, context: apps/hachiman-server, file: apps/hachiman-server/Dockerfile.media }
          - { name: takusen, context: ., file: apps/takusen/Dockerfile }
          - { name: web, context: ., file: apps/hachiman-browser/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check the domain variable
        if: matrix.name == 'web' && vars.HACHIMAN_DOMAIN == ''
        run: echo "::error::Set the repository variable HACHIMAN_DOMAIN" && exit 1
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/arm64
          push: true
          build-args: DOMAIN=${{ vars.HACHIMAN_DOMAIN }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/hachiman-${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/hachiman-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
