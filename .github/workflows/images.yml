# Builds the server images for linux/arm64 (the Oracle A1 VM), pushes them to GHCR as
# ghcr.io/<owner>/hachiman-<name>:latest and :<sha>, then deploys that sha (migrations, then the stack).
# Settings > Secrets and variables > Actions:
#   variables HACHIMAN_DOMAIN (the web image bakes the endpoints in) and DEPLOY_HOST (the VM's public IP)
#   secrets DEPLOY_SSH_KEY (private key of a key in ubuntu's authorized_keys) and DEPLOY_KNOWN_HOSTS (ssh-keyscan <ip>)
name: Images
on:
  push:
    branches: [main]
    paths:
      - 'apps/takusen/**'
      - 'apps/hachiman/**'
      - 'apps/hachiman-browser/**'
      - 'apps/hachiman-electron/src/main/csp-policy.ts'
      - 'apps/hachiman-server/**'
      - 'infra/compose.yml'
      - 'infra/Caddyfile'
      - 'infra/*.sh'
      - 'pkgs/**'
      - 'patches/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    # arm64 standard runners are free in private repositories (counted against the plan minutes).
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gateway, context: apps/hachiman-server, file: apps/hachiman-server/Dockerfile.gateway }
          - { name: media, context: apps/hachiman-server, file: apps/hachiman-server/Dockerfile.media }
          - { name: takusen, context: ., file: apps/takusen/Dockerfile }
          - { name: web, context: ., file: apps/hachiman-browser/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check the domain variable
        if: matrix.name == 'web' && vars.HACHIMAN_DOMAIN == ''
        run: echo "::error::Set the repository variable HACHIMAN_DOMAIN" && exit 1
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/arm64
          push: true
          build-args: DOMAIN=${{ vars.HACHIMAN_DOMAIN }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/hachiman-${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/hachiman-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    # Skipped until the VM exists and DEPLOY_HOST is set (infra/README.md).
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    concurrency: deploy
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      # In RUNNER_TEMP, not ~/.ssh, so the step is also safe on a persistent self-hosted runner.
      - name: SSH key
        run: |
          (umask 077 && echo "${{ secrets.DEPLOY_SSH_KEY }}" > "$RUNNER_TEMP/deploy_key")
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > "$RUNNER_TEMP/known_hosts"
      # GITHUB_TOKEN lets the VM pull the private images during this job.
      - run: infra/deploy.sh
        env:
          SSH: ssh -i ${{ runner.temp }}/deploy_key -o IdentitiesOnly=yes -o UserKnownHostsFile=${{ runner.temp }}/known_hosts
          DOMAIN: ${{ vars.HACHIMAN_DOMAIN }}
          HOST: ${{ vars.DEPLOY_HOST }}
          IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/hachiman
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # GHCR is free for now, but every push adds a version of each image. Keep the newest 10 (rollback targets).
  prune:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        name: [gateway, media, takusen, web]
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: hachiman-${{ matrix.name }}
          package-type: container
          min-versions-to-keep: 10
