<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <title>Hachiman</title>
    <!-- No CSP meta here: the main process sends the Content-Security-Policy
         header, built from the same Vite env the renderer uses (src/main/csp.ts). -->
    <!-- Paint the dark app background before CSS loads (no white flash). Scoped to html.dark so
         it never outranks the light theme once the layered stylesheet loads. -->
    <style>
      html.dark {
        background-color: #22252c;
        color-scheme: dark;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
