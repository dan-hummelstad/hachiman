syntax = "proto3";

package hachiman.management.v1;

option go_package = "hachiman/server/pkg/management;management";

// Management is the media-plane registry + placement surface. Takusen serves it
// (loading this file dynamically via @grpc/proto-loader); hachiman-media
// registers + heartbeats, hachiman-gateway asks for placement.
// Contract: docs/gateway-protocol.md §9.
service Management {
  // Idempotent: re-registering the same node_id replaces the row.
  rpc RegisterMediaNode(RegisterMediaNodeRequest) returns (RegisterMediaNodeResponse);
  // Takusen drops nodes that miss 3 consecutive heartbeats from placement.
  // accepting=false = drain (existing sessions kept, no new placements).
  rpc MediaNodeHeartbeat(MediaNodeHeartbeatRequest) returns (MediaNodeHeartbeatResponse);
  // Picks a node for a voice channel. Channel→node stickiness lives in Redis
  // voice_room:{channelId} on the gateway side, not here.
  rpc PlaceMediaSession(PlaceMediaSessionRequest) returns (PlaceMediaSessionResponse);
}

message RegisterMediaNodeRequest {
  string node_id = 1;
  string region = 2;
  // Public voice WS URL clients dial, e.g. wss://media-1.example.com/voice.
  string signaling_url = 3;
  uint32 max_sessions = 4;
  string version = 5;
}

message RegisterMediaNodeResponse {}

message MediaNodeHeartbeatRequest {
  string node_id = 1;
  uint32 active_sessions = 2;
  float cpu_fraction = 3;
  bool accepting = 4;
}

message MediaNodeHeartbeatResponse {}

message PlaceMediaSessionRequest {
  string channel_id = 1;
  string home_region = 2;
  string guild_id = 3;
}

message PlaceMediaSessionResponse {
  string node_id = 1;
  string signaling_url = 2;
}
