syntax = "proto3";

package hachiman.media.v1;

option go_package = "mumble.info/grumble/pkg/mediaproto;mediaproto";

// MediaControl is the control↔media sidechannel: a single bidirectional gRPC
// stream over mTLS carrying all events between a control plane instance and a
// media-plane node.
//
// Wire shape (per MEDIA-PLANE-MIGRATION.md Phase 1 step 5 / Phase 2 step 4):
//   - One persistent bidi stream per (control, media-node) pair.
//   - Every Envelope carries an idempotency_key; receivers de-dupe by key
//     within a bounded window. At-least-once delivery, exactly-once side-effect.
//   - Messages are framed as an Envelope with a oneof `payload`. The set of
//     payload kinds expands across phases; the proto is forward-compatible by
//     virtue of oneof + reserved tags.
//
// What's defined here is the PHASE 1 BASELINE — just enough to:
//   - register a media node with the control plane,
//   - heartbeat liveness + capacity,
//   - open / close a room (the unit the SFU bundles SSRCs around),
//   - push an ExpectedSession (token + DTLS fingerprint + SSRC) before the
//     client opens its WebRTC connection — the token-transport mechanism.
//   - report session lifecycle back upstream.
//
// Phase 2 layers in:
//   - SubscriptionMatrixUpdate (ACL-precomputed who-can-hear-whom),
//   - QualityProfileApplied, KeySetUpdate,
//   - E2EE epoch bumps, RecordingStart/Stop, AttachRecorder,
//   - RoomMembershipSnapshot (full state pump on reconnect),
//   - RemoteRelayedTrack / RelayHopMetadata (cascading shape).
//
// New payload kinds get appended to the oneof; tag numbers are stable forever.
// Removed kinds get their tag numbers reserved.

service MediaControl {
  // Sidechannel is the single bidirectional event stream. Either side opens
  // it (in practice the media node opens, since it knows the control address);
  // the first message MUST be from media → control with payload=register_node.
  // The control plane refuses the stream if RegisterNode is malformed.
  rpc Sidechannel(stream Envelope) returns (stream Envelope);
}

// Envelope wraps every message with a unique idempotency_key. Receivers MUST
// hold a bounded LRU of recently-seen keys (window = 5 minutes is the phase 1
// default) and treat a duplicate as a no-op ack.
message Envelope {
  // Globally unique key for this message. Sender generates; receiver de-dupes.
  // For events that are inherently idempotent (Heartbeat) the sender MAY reuse
  // the empty string and skip de-dup, but new code SHOULD generate UUIDv7.
  string idempotency_key = 1;

  // Per-direction monotonic sequence number. Each side maintains its OWN
  // counter; the receiver's last successfully-processed seq is what
  // Ack.acks_seq refers to (acknowledging the SENDER's seq, not its own).
  // Used for ordering assertions in tests and for partition reconciliation
  // (control re-sends from the last ack'd seq on reconnect).
  uint64 seq = 2;

  oneof payload {
    // ─── media → control ─────────────────────────────────────────────────
    RegisterNode register_node = 10;
    Heartbeat heartbeat = 11;
    SessionEstablished session_established = 12;
    SessionEnded session_ended = 13;
    TalkingStateChanged talking_state_changed = 14;
    NodeHealthReport node_health_report = 15;
    BandwidthReport bandwidth_report = 16;

    // ─── media → control (phase 2 additions, tags 17–25 reserved range) ──
    RecordingSegmentSealed recording_segment_sealed = 17;
    RelayHopMetadata relay_hop_metadata = 18;

    // ─── control → media ─────────────────────────────────────────────────
    OpenRoom open_room = 30;
    CloseRoom close_room = 31;
    // OpenSession pushes the ExpectedSession (token + DTLS fingerprint + SSRC)
    // BEFORE the client opens its WebRTC connection. When the client's DTLS
    // handshake arrives, media validates the cert fingerprint against the
    // expected one and rejects on mismatch. The token never crosses the
    // client → media wire.
    OpenSession open_session = 32;
    CloseSession close_session = 33;
    KickSession kick_session = 34;

    // ─── control → media (phase 2 additions, tags 35–60 reserved range) ──
    RoomMembershipSnapshot room_membership_snapshot = 35;
    UserJoinedChannel user_joined_channel = 36;
    UserLeftChannel user_left_channel = 37;
    MuteDeafChanged mute_deaf_changed = 38;
    VoiceTargetChanged voice_target_changed = 39;
    ACLChanged acl_changed = 40;
    SubscriptionMatrixUpdate subscription_matrix_update = 41;
    QualityProfileApplied quality_profile_applied = 42;
    KeySetUpdate key_set_update = 43;
    E2EEMemberJoin e2ee_member_join = 44;
    E2EEMemberLeave e2ee_member_leave = 45;
    RecordingStart recording_start = 46;
    RecordingStop recording_stop = 47;
    AttachRecorder attach_recorder = 48;
    RemoteRelayedTrack remote_relayed_track = 49;

    // ─── both directions (signaling forwarders) ──────────────────────────
    // Phase 1 final pass: the SFU runs on hachiman-media, but Mumble's
    // WebRTC / IceCandidate control-channel messages arrive at control over
    // TCP/WSS. Control forwards them to the assigned media node as
    // SdpSignal / IceCandidateSignal envelopes; media forwards its own
    // generated offers / ICE candidates back to control the same way and
    // control delivers them to the client over Mumble.
    SdpSignal sdp_signal = 61;
    IceCandidateSignal ice_candidate_signal = 62;

    // ─── control → media (channel-move dispatch) ─────────────────────────
    // Phase 1 final pass HIGH #3: control informs media when a Mumble user
    // changes channels so the room-membership fanout topology stays in sync.
    SessionMove session_move = 63;

    // ─── both directions (acks, errors) ──────────────────────────────────
    Ack ack = 90;
    StreamError error = 91;
  }

  // Reserved for future payload kinds added in later phases. DO NOT reuse.
  // Phase 2 has now claimed 17–18 (media→control) and 35–49 (control→media)
  // from the previously-carved 17–25 / 35–60 reservation ranges. Phase 1
  // final pass claimed 61–62 for the signaling forwarders and 63 for the
  // channel-move dispatch. The unused tails (19–25, 50–60) remain reserved
  // for later additions.
  reserved 19 to 25, 50 to 60, 92 to 99;
}

// ─── media → control payloads ──────────────────────────────────────────────

message RegisterNode {
  // Node-generated UUID, stable for the node's lifetime. On a fresh node boot
  // a new UUID is generated; on reconnect after a sidechannel partition the
  // SAME UUID is re-sent so control can rejoin existing rooms to this node.
  string node_id = 1;
  // Region tag, e.g. "us-east", "eu-west". Set via -region CLI flag.
  string region = 2;
  // Inbound sidechannel address (host:port). Control can reverse-dial if
  // needed (rare; the stream is normally driven by media's outbound dial).
  string sidechannel_addr = 3;
  // Static capacity declaration: max concurrent sessions this node will serve.
  uint32 max_sessions = 4;
  // Build version for ops visibility.
  string version = 5;
}

message Heartbeat {
  // Live counters at the moment of emission.
  uint32 active_sessions = 1;
  uint32 active_rooms = 2;
  // Per-resource utilization. 0..1 fractions.
  float cpu_fraction = 3;
  float memory_fraction = 4;
  // "true" = accepting new sessions, "false" = drain mode (placement excludes).
  bool accepting = 5;
}

message SessionEstablished {
  string session_id = 1;
  string room_id = 2;
  // SSRC actually assigned (mirrors the token claim — control matches to
  // detect drift).
  uint32 ssrc = 3;
}

message SessionEnded {
  string session_id = 1;
  // Reason enum kept narrow for phase 1; expanded later.
  enum Reason {
    REASON_UNSPECIFIED = 0;
    REASON_CLIENT_DISCONNECT = 1;
    REASON_ICE_FAILED = 2;
    REASON_KICK = 3;
    REASON_TOKEN_EXPIRED = 4;
    REASON_NODE_SHUTDOWN = 5;
  }
  Reason reason = 2;
}

message TalkingStateChanged {
  string session_id = 1;
  bool talking = 2;
}

message NodeHealthReport {
  // Last-N error counts for ops alerting. Phase 1 keeps a flat int; later
  // versions can promote this to structured per-subsystem counters.
  uint32 sidechannel_rpc_errors = 1;
  uint32 dtls_handshake_failures = 2;
  uint32 token_validation_failures = 3;
}

message BandwidthReport {
  uint64 rx_bytes_per_sec = 1;
  uint64 tx_bytes_per_sec = 2;
}

// ─── control → media payloads ──────────────────────────────────────────────

message OpenRoom {
  string room_id = 1;
  // FK back to control's channel record. Media doesn't dereference this — it's
  // an opaque correlation id for logs / metrics.
  uint64 channel_id = 2;
  // Region this room's primary node serves. Cascade peers receive a different
  // OpenRoom indicating they're a peer (see Phase 3 cascading work).
  string home_region = 3;
}

message CloseRoom {
  string room_id = 1;
}

message OpenSession {
  // The session_id mints control → embeds in the voice token.
  string session_id = 1;
  string room_id = 2;
  // Opaque user id (per the Observability PII rule — NOT username/email).
  string user_id = 3;
  // DTLS-fingerprint binding (CRITICAL). MUST be the lower-case
  // `<algo> <hex>:<hex>:...:<hex>` canonical form per RFC 8122 §5
  // (e.g. `sha-256 a1:b2:c3:...`). Both control and media MUST normalize to
  // this exact form before equality check — case-mismatch or stray padding
  // is a rejection, not a soft compare. Media rejects DTLS handshakes whose
  // cert fingerprint doesn't match.
  string dtls_fingerprint = 4;
  // ICE ufrag the client committed at RTCPeerConnection creation.
  string ice_ufrag = 5;
  // SSRC allocated by control at token mint, embedded in the signed token.
  uint32 ssrc = 6;
  // Voice token bytes (PASETO v4.public — phase 1 settled on PASETO; see
  // pkg/voicetoken/). Media verifies signature + claims via the Signer
  // interface, then matches dtls_fingerprint above against the
  // RTCPeerConnection's cert fingerprint at DTLS time.
  bytes voice_token = 7;
  // Wall-clock expiry — media tears the session down if reached without a
  // refresh-token push.
  int64 expires_at_unix = 8;
}

message CloseSession {
  string session_id = 1;
}

message KickSession {
  string session_id = 1;
  // Free-text reason surfaced in logs for forensics.
  string reason = 2;
}

// ─── shared payloads ───────────────────────────────────────────────────────

message Ack {
  // idempotency_key of the message being acknowledged.
  string acks_key = 1;
  // Highest seq successfully processed by the receiver. Used by senders to
  // garbage-collect their unacked-message ring on reconnect.
  uint64 acks_seq = 2;
}

message StreamError {
  // idempotency_key of the message that triggered the error, if any.
  string for_key = 1;
  // Programmatic error code. Phase 1 keeps it narrow; later versions grow it.
  enum Code {
    CODE_UNSPECIFIED = 0;
    CODE_MALFORMED = 1;
    CODE_UNKNOWN_SESSION = 2;
    CODE_UNKNOWN_ROOM = 3;
    CODE_TOKEN_INVALID = 4;
    CODE_INTERNAL = 99;
  }
  Code code = 2;
  string message = 3;
}

// ─── phase 2: media → control payloads ────────────────────────────────────

// Recorder service notifies control when a segment has been durably written
// to S3. Control mirrors the metadata into the recording-segments table so
// admins can render the segment list without polling the recorder.
//
// "Recorder" is a separate binary; phase 2 ships the proto only, runtime
// lands in phase 4+.
message RecordingSegmentSealed {
  string room_id = 1;
  string segment_id = 2;
  // S3 object key — full path under the tenant's bucket.
  // Shape: `{yyyy}/{mm}/{dd}/{room_id}/{session_id}/{track_id}/{seg}.{ext}`.
  string s3_key = 3;
  // Wall-clock segment duration in ms (audio + video have separate segments
  // per track, each with its own duration).
  uint32 duration_ms = 4;
  // Track this segment belongs to (matches MediaTrackPublish.track_id).
  string track_id = 5;
  // 0-indexed segment counter within (room_id, session_id, track_id). Used
  // to assert continuity after recorder failover.
  uint64 segment_index = 6;
}

// Cascading: a cascade peer reports an inbound track it's relaying from
// another node (or being relayed to one). Used by control for cascade-aware
// observability + by recording (recorder always subscribes to the primary
// only, so cascade peers forward upstream tracks via this metadata).
//
// Phase 2 ships the proto only; cascade runtime lands in phase 3.
message RelayHopMetadata {
  // Original SSRC at the publishing client (not rewritten across hops).
  uint32 originating_ssrc = 1;
  // Node id of the SFU the publishing client is directly connected to.
  string source_node_id = 2;
  // Reporting node's region.
  string reporting_region = 3;
  // Hop count from the publisher to this node — 1 for a direct primary, 2+
  // for cascaded paths.
  uint32 hops = 4;
}

// ─── phase 2: control → media payloads ────────────────────────────────────

// Full per-room state pump. Sent on sidechannel reconnect after a partition
// so media can reconcile its in-memory routing table against control's
// authoritative state. Atomic: media MUST apply the whole snapshot or none.
message RoomMembershipSnapshot {
  string room_id = 1;
  // Snapshot generation — bumped on every snapshot send so media can detect
  // stale snapshots arriving after a newer one was applied.
  uint64 generation = 2;
  // Active sessions in the room at snapshot time.
  repeated MembershipEntry members = 3;
  // Currently-applied subscription matrix (mirrors the latest
  // SubscriptionMatrixUpdate). Repeated here so a single snapshot is
  // self-sufficient.
  repeated SubscriptionEntry subscriptions = 4;
  // Whether recording is active at snapshot time, and on which recorder.
  bool recording_active = 5;
  string recording_recorder_id = 6;
}

message MembershipEntry {
  string session_id = 1;
  string user_id = 2;
  uint32 mumble_session = 3;
  bool muted = 4;
  bool deafened = 5;
}

// User joined a channel (control → media so media can update its room
// membership without waiting for the next snapshot).
message UserJoinedChannel {
  string room_id = 1;
  string session_id = 2;
  string user_id = 3;
  uint32 mumble_session = 4;
}

message UserLeftChannel {
  string room_id = 1;
  string session_id = 2;
}

// Mute/deaf state change — media uses this to drop / keep forwarding voice
// without needing ACL knowledge.
message MuteDeafChanged {
  string session_id = 1;
  bool muted = 2;
  bool deafened = 3;
  bool self_muted = 4;
  bool self_deafened = 5;
}

// Whisper / shout target update. Control pre-resolves the target session
// set (no group expansion on media). Replaces the legacy Mumble VoiceTarget
// message which is deleted from the wire.
message VoiceTargetChanged {
  string session_id = 1;
  // Target slot ID (1..30 per Mumble convention, 0 = clear all).
  uint32 target_id = 2;
  // Pre-resolved recipient session ids.
  repeated string recipient_session_ids = 3;
}

// ACL has changed — control re-runs the matrix computation and pushes a new
// SubscriptionMatrixUpdate. This message is informational so media can log
// the cause of the matrix update.
message ACLChanged {
  string room_id = 1;
  uint64 channel_id = 2;
  // Cause of the change (free-text, e.g. "admin edit", "group membership").
  string reason = 3;
}

// Authoritative who-can-hear-whom. Media has zero ACL logic — it just routes
// per this matrix. Every update is a FULL REPLACEMENT (delete-all-then-apply
// semantics) — control pre-computes the complete matrix on every audibility
// change. If future scale work demonstrates the recompute is hot, introduce a
// distinct `SubscriptionMatrixDelta` RPC instead of overloading a flag on
// this message; mixed-semantics-per-RPC is the kind of ambiguity that bites
// on the next protocol cut. Field 4 is INTENTIONALLY LEFT UNUSED so a future
// delta RPC can't accidentally collide with stale `partial=true` parsers.
message SubscriptionMatrixUpdate {
  string room_id = 1;
  // Bumped monotonically; media discards updates with generation < current.
  uint64 generation = 2;
  repeated SubscriptionEntry entries = 3;
  reserved 4;
  reserved "partial";
}

message SubscriptionEntry {
  // The receiver — the session that may hear the publishers in `publishers`.
  string receiver_session_id = 1;
  // Sessions whose tracks should be forwarded to receiver.
  repeated string publisher_session_ids = 2;
  // Per-track filters: only forward tracks whose kind is in this set. Empty
  // = all kinds.
  repeated string allowed_kinds = 3;
}

// A new quality profile was applied to the room — media may need to retune
// jitter buffer / forwarding behaviour. Mirrors the client-side
// `QualityProfile` message in Mumble.proto.
message QualityProfileApplied {
  string room_id = 1;
  uint32 profile_id = 2;
  string voice_codec = 3;
  uint32 voice_bitrate_min = 4;
  uint32 voice_bitrate_max = 5;
  uint32 voice_ptime_ms = 6;
  bool voice_fec = 7;
  bool voice_dtx = 8;
  uint32 jitter_target_ms = 9;
  uint32 jitter_max_ms = 10;
  repeated string screen_codecs = 11;
  repeated string screen_ladder = 12;
  bool requires_renegotiation = 13;
}

// Signing-key rotation: control just rotated the Ed25519 signer used to mint
// voice tokens and E2EE key envelopes. Media updates its trusted-key set so
// existing in-flight tokens validate during the overlap window.
message KeySetUpdate {
  // All key IDs that should currently verify. Always includes the new active
  // key plus any keys still in their grace window.
  repeated string active_key_ids = 1;
  // Public key material per ID, raw 32-byte Ed25519 keys.
  map<string, bytes> public_keys = 2;
  // Optional: key IDs that have been explicitly revoked (compromised key
  // path — invalidate all sessions still using them).
  repeated string revoked_key_ids = 3;
}

// Membership change in the E2EE key-share set. Forces a per-room epoch bump
// — control will follow up with E2EEKeyMaterial pushes to each remaining
// participant. Media doesn't see room keys; this message is informational
// (e.g. for the "next epoch starts at SSRC X" book-keeping).
message E2EEMemberJoin {
  string room_id = 1;
  string session_id = 2;
  // Epoch the joining member's first frames will arrive under.
  uint32 epoch = 3;
}

message E2EEMemberLeave {
  string room_id = 1;
  string session_id = 2;
  uint32 epoch = 3;
}

// Recording opt-in: admin enabled recording for this room. Media's job is to
// allow the recorder service to subscribe via `SubscribeAsRecorder` on the
// recorder↔media sidechannel (defined in pkg/recorderproto/).
message RecordingStart {
  string room_id = 1;
  // Recorder instance that will subscribe. Matches the recorder's
  // RegisterNode equivalent.
  string recorder_id = 2;
  // Retention bucket / policy id (e.g. "30d", "7y"). Recorder writes this
  // through to S3 object-lock.
  string retention_policy = 3;
}

message RecordingStop {
  string room_id = 1;
  string recorder_id = 2;
}

// Under E2EE: control invites a recorder's pubkey into the per-room
// key-share set. Recorder participation is visible to admins (audit log +
// UI indicator). Without this, segments stay encrypted at rest and require
// explicit unsealing to play back.
message AttachRecorder {
  string room_id = 1;
  string recorder_id = 2;
  // Raw 32-byte X25519 pubkey of the recorder, used for HPKE-style sealing
  // of the per-room key material.
  bytes recorder_pubkey = 3;
}

// Cascading: control instructs a cascade peer to start forwarding a remote
// track (originating on a different SFU node) to the subscribers in its
// region. The peer treats the remote track as a normal publisher SSRC for
// subscription matching but tags forwarded frames with RelayHopMetadata.
//
// Phase 2 ships the proto only; cascade runtime lands in phase 3.
message RemoteRelayedTrack {
  string room_id = 1;
  // Source node forwarding the track into this peer.
  string source_node_id = 2;
  // Originating SSRC at the publishing client.
  uint32 originating_ssrc = 3;
  // SSRC this peer should use when forwarding to its local subscribers.
  // Distinct so SRTP state stays per-hop.
  uint32 local_ssrc = 4;
  // Track kind (mirrors MediaKind in Mumble.proto). Kept as a string here to
  // avoid a cross-proto enum dependency. Canonical values: "voice" | "screen"
  // | "camera". Unknown values are ignored by receivers (mirrors MediaKind's
  // open-enum semantics).
  string kind = 5;
  // Publisher's session id — used for subscription-matrix matching.
  string publisher_session_id = 6;
}

// ─── phase 1 final pass: SDP / ICE signaling forwarders ───────────────────

// SdpSignal forwards an SDP offer/answer between control and media over the
// sidechannel. Bidirectional:
//   - control → media: forwards the client's SDP arriving over Mumble TCP.
//   - media → control: media's SDP needing to reach the client.
// Receiver inspects sdp_type to dispatch. generation/seq are phase-2 wire
// fields preserved for the polite-peer state machine; phase 1 leaves them 0.
message SdpSignal {
  string session_id = 1;
  string sdp_type = 2;  // "offer" | "answer"
  string sdp = 3;
  uint32 generation = 4;
  uint32 seq = 5;
}

// IceCandidateSignal forwards a trickle ICE candidate between control and
// media over the sidechannel. Same bidirectional semantics as SdpSignal.
// candidate_json is the same JSON the Mumble IceCandidate.content field
// carries — an RTCIceCandidateInit per WebRTC spec.
//
// EOC SENTINEL (phase 1 final pass MEDIUM #4): an EMPTY candidate_json
// signals end-of-candidates (pion fires `OnICECandidate(nil)` when the
// gatherer finishes). Receivers MUST forward the empty signal through; the
// client uses it to finalize ICE gathering rather than waiting for the
// connectivity timeout.
message IceCandidateSignal {
  string session_id = 1;
  string candidate_json = 2;
  uint32 generation = 3;
  uint32 seq = 4;
}

// SessionMove transfers an existing session between rooms on the media side.
// Sent control → media when a Mumble user changes channels (phase 1 final
// pass HIGH #3). Media moves the session_id between r.rooms entries under
// r.mu and updates sessionState.roomID; no peer renegotiation is needed
// (the SDP doesn't carry channel/room semantics — only the fanout topology
// does). Idempotent if old_room_id == new_room_id; safe to receive multiple
// times via at-least-once delivery.
message SessionMove {
  string session_id = 1;
  string old_room_id = 2;
  string new_room_id = 3;
}
